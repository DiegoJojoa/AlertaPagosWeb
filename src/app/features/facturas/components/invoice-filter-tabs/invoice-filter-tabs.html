<div class="invoice-filter" role="group" aria-label="Filtrar facturas">
  <button
    type="button"
    class="invoice-filter__option"
    [class.invoice-filter__option--selected]="selectedFilter() === 'pendientes'"
    [attr.aria-pressed]="selectedFilter() === 'pendientes'"
    (click)="filterChanged.emit('pendientes')"
  >
    Pendientes
  </button>
  <button
    type="button"
    class="invoice-filter__option"
    [class.invoice-filter__option--selected]="selectedFilter() === 'proximas'"
    [attr.aria-pressed]="selectedFilter() === 'proximas'"
    (click)="filterChanged.emit('proximas')"
  >
    Próximos
  </button>
</div>
